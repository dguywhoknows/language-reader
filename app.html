<!doctype html>
<html lang="en" data-gate="app">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lang Lens</title>
<meta name="description" content="Generate a graded story or paste your own text. Tap a word for a translation that fits the sentence, mark the words you know, and review new ones with spaced repetition. Nine languages are supported.">
<meta name="app-repo" content="https://github.com/dguywhoknows/language-reader">
<meta name="app-version" content="2.0.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23b0552b'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-weight='700' font-size='19' fill='white'%3EL%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style id="type">:root { --font-head: 'Source Serif 4', Georgia, serif; --font-body: 'Source Sans 3', system-ui, sans-serif; }</style>
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/app.css">
<script src="src/lib/config.js"></script>
<script src="src/lib/auth.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand"><div><h1><a class="logo-link" href="index.html" title="Home page">Lang Lens</a></h1><p>Read real text in another language and look words up in context.</p></div></div>
  <nav class="topnav" data-nav aria-label="Pages"></nav>
  <div class="top-actions"><a class="btn ghost sm" href="https://github.com/dguywhoknows/language-reader" target="_blank" rel="noopener">GitHub</a><span data-ai-badge></span></div>
</header>
<div class="page active" data-page="read" data-title="Read">
<main class="layout">
  <section class="stack">
    <div class="card">
      <div class="row">
        <select id="lang" style="width:auto"></select>
        <select id="cefr" style="width:auto" aria-label="Level"><option>A1</option><option selected>A2</option><option>B1</option><option>B2</option><option>C1</option></select>
        <input class="input grow" id="topic" placeholder="Story topic, e.g. a lost cat in Madrid" value="a morning at the market">
        <button class="btn primary" id="gen">Graded story</button>
        <button class="btn ghost" id="pasteBtn">Paste my own text</button>
      </div>
      <textarea id="paste" class="hidden" rows="5" placeholder="Paste any text in your target language, then press Load." style="margin-top:10px"></textarea>
      <div class="row hidden" id="pasteRow" style="margin-top:8px"><button class="btn" id="load">Load text</button></div>
    </div>
    <article class="card reader">
      <div class="row between"><h2 id="title" style="margin:0"></h2><div class="row"><span class="tag" id="level"></span><span class="tag accent" id="comp"></span><button class="btn sm ghost" id="speakAll">Read aloud</button></div></div>
      <div id="text" class="text" lang=""></div>
      <div class="legend small muted"><span class="w new">new</span> <span class="w learning">learning</span> <span class="w known">known</span> · click a word to look it up, click the ¶ mark to translate a sentence</div>
    </article>
    <div class="card"><div class="row between"><h2 style="margin:0">Comprehension quiz</h2><button class="btn sm" id="quizBtn">Generate quiz</button></div><div id="quiz"></div></div>
  </section>
  <aside class="stack side-col">
    <div class="card gloss" id="gloss"><div class="empty">Tap any word.</div></div>
    <div class="card">
      <h2>Vocabulary</h2>
      <div class="grid cols-3" id="vstats"></div>
      <div class="row" style="margin-top:10px"><button class="btn sm" id="markAll">Mark remaining new as known</button><button class="btn sm ghost" id="exportV">Export CSV</button></div>
      <div id="learningList" class="learning-list"></div>
    </div>
  </aside>
</main>
</div>
<div class="page" data-page="review" data-title="Review">
<main class="stack" style="max-width:760px">
  <div class="page-head"><div><h2>Review</h2><p id="revSummary"></p></div><div class="row"><select id="revMode" style="width:auto" aria-label="Review mode"><option value="recall">Recall the meaning</option><option value="cloze">Fill the gap (type the word)</option></select><button class="btn primary" id="revStart">Start</button></div></div>
  <div id="revCard"></div>
</main>
</div>

<div class="page" data-page="library" data-title="Library">
<main class="stack">
  <div class="page-head"><div><h2>Library</h2><p id="libSummary"></p></div><label class="btn ghost">Import .txt<input type="file" id="libFile" accept=".txt,text/plain" hidden></label></div>
  <div class="grid cols-3" id="libList"></div>
</main>
</div>

<div class="page" data-page="vocab" data-title="Vocabulary">
<main class="stack">
  <div class="card row"><input class="input grow" id="vSearch" placeholder="Search words or translations" aria-label="Search"><select id="vState" style="width:auto" aria-label="Filter"><option value="">All</option><option value="learning">Learning</option><option value="known">Known</option><option value="due">Due for review</option></select><button class="btn ghost" id="vCsv">CSV</button><button class="btn ghost" id="vAnki">Anki</button><label class="btn ghost">Import<input type="file" id="vImport" accept=".csv,.tsv,.txt" hidden></label></div>
  <div class="card table-wrap" style="max-height:640px"><table id="vTable"></table></div>
</main>
</div>

<div class="page" data-page="stats" data-title="Stats">
<main class="stack">
  <div class="kpis" id="sKpis"></div>
  <div class="grid cols-2">
    <div class="card"><h2>Last 30 days</h2><div id="sChart"></div></div>
    <div class="card"><h2>Most frequent new words in this text</h2><div id="sFreq"></div></div>
  </div>
</main>
</div>

<div class="page" data-page="settings" data-title="Settings"></div>
<script src="src/lib/dom.js"></script>
<script src="src/lib/ai.js"></script>
<script src="src/lib/router.js"></script>
<script src="src/lib/copilot.js"></script>
<script src="src/core.js"></script>
<script src="src/demo.js"></script>
<script src="src/app.js"></script>
</body>
</html>
